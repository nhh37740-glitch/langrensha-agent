name: 版本图检查

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  diagram:
    name: 版本图检查
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库与图中引用的提交
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 核对版本图及浏览器布局
        run: |
          for diagram_name in 'v0.1.0/最小内核架构.architecture' 'v0.2.0/DeepSeek决策架构.architecture' 'v0.3.0/完整对局架构.architecture' 'v0.3.1/暗牌呈现架构.architecture' 'v0.4.0/HTTPS与恢复架构.architecture' 'v0.4.0/自动发布架构.architecture' 'v0.4.1/代码架构.architecture' 'v0.5.0/前端状态图.lifecycle' 'v0.5.1/一次行动运行过程.workflow'; do
            diagram_type="${diagram_name##*.}"
            diagram_path="${diagram_name%.*}"
            diagram_version="${diagram_path%%/*}"
            python .github/scripts/获取版本图源码.py \
              "文档/版本/$diagram_path.$diagram_type.json" \
              "refs/heads/evidence/archify-$diagram_version"
            node .agents/skills/archify/bin/archify.mjs finalize "$diagram_type" \
              "文档/版本/$diagram_path.$diagram_type.json" \
              "临时/版本图检查/$diagram_path.$diagram_type.html" \
              --repo-root . --quality showcase --out-dir "临时/版本图检查/$diagram_path.$diagram_type-证据" --json
            python .github/scripts/校验版本图.py \
              "文档/版本/$diagram_path.$diagram_type.json" \
              "文档/版本/$diagram_path.html" \
              "临时/版本图检查/$diagram_path.$diagram_type.html"
          done
      - name: 保存版本图验证证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 内核版本图验证
          path: 临时/版本图检查/
