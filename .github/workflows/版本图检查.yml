name: 版本图检查

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  diagram:
    name: 版本图检查
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库与图中引用的提交
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 准备中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK SC'
      - name: 核对版本图及浏览器布局
        run: |
          for diagram_name in 'v0.1.0/最小内核架构.architecture' 'v0.2.0/DeepSeek决策架构.architecture' 'v0.3.0/完整对局架构.architecture' 'v0.3.1/暗牌呈现架构.architecture' 'v0.4.0/HTTPS与恢复架构.architecture' 'v0.4.0/自动发布架构.architecture' 'v0.4.1/代码架构.architecture' 'v0.5.0/前端状态图.lifecycle' 'v0.5.1/一次行动运行过程.workflow' 'v0.6.0/RAG语义检索流程.workflow' 'v0.7.0/世界书选择与主题.architecture'; do
            diagram_type="${diagram_name##*.}"
            diagram_path="${diagram_name%.*}"
            diagram_version="${diagram_path%%/*}"
            python .github/scripts/获取版本图源码.py \
              "文档/版本/$diagram_path.$diagram_type.json" \
              "refs/heads/evidence/archify-$diagram_version"
            node .agents/skills/archify/bin/archify.mjs finalize "$diagram_type" \
              "文档/版本/$diagram_path.$diagram_type.json" \
              "临时/版本图检查/$diagram_path.$diagram_type.html" \
              --repo-root . --quality showcase --out-dir "临时/版本图检查/$diagram_path.$diagram_type-证据" --json
            python .github/scripts/校验版本图.py \
              "文档/版本/$diagram_path.$diagram_type.json" \
              "文档/版本/$diagram_path.html" \
              "临时/版本图检查/$diagram_path.$diagram_type.html"
          done
      - name: 核对当前后端导读图与源码
        run: |
          for diagram_name in '后端结构.architecture' '一次行动.sequence'; do
            diagram_type="${diagram_name##*.}"
            diagram_path="${diagram_name%.*}"
            source_path="文档/架构/后端源码导读/$diagram_name.json"
            revision=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["meta"]["repository"]["revision"])' "$source_path")
            git cat-file -e "$revision^{commit}"
            git merge-base --is-ancestor "$revision" HEAD
            output_path="临时/版本图检查/后端源码导读/$diagram_path.html"
            node .agents/skills/archify/bin/archify.mjs finalize "$diagram_type" \
              "$source_path" "$output_path" --repo-root . --quality showcase \
              --out-dir "临时/版本图检查/后端源码导读/$diagram_path-证据" --json
            python .github/scripts/校验版本图.py "$source_path" \
              "文档/架构/后端源码导读/$diagram_path.html" "$output_path"
            node .agents/skills/archify/bin/archify.mjs visual-check "$output_path" \
              --out-dir "临时/版本图检查/后端源码导读/$diagram_path-截图" --summary --require-provenance
          done
      - name: 核对后端运行流程与离线入口
        run: |
          for source_path in 文档/架构/后端运行流程/*.workflow.json; do
            diagram_name=$(basename "$source_path" .workflow.json)
            revision=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["meta"]["repository"]["revision"])' "$source_path")
            git cat-file -e "$revision^{commit}"
            git merge-base --is-ancestor "$revision" HEAD
            output_path="临时/版本图检查/后端运行流程/$diagram_name.html"
            node .agents/skills/archify/bin/archify.mjs finalize workflow \
              "$source_path" "$output_path" --repo-root . --quality showcase \
              --out-dir "临时/版本图检查/后端运行流程/$diagram_name-证据" --json
            python .github/scripts/校验版本图.py "$source_path" \
              "文档/架构/后端运行流程/$diagram_name.html" "$output_path"
            node .agents/skills/archify/bin/archify.mjs visual-check "$output_path" \
              --out-dir "临时/版本图检查/后端运行流程/$diagram_name-截图" --summary --require-provenance
          done
          google-chrome --headless --disable-gpu --no-sandbox --window-size=1440,1100 \
            --screenshot="$(pwd)/临时/版本图检查/后端运行流程/打开入口.png" \
            "file://$(pwd)/文档/架构/后端运行流程/打开我.html"
      - name: 打包可离线阅读的后端流程
        run: |
          python .github/scripts/打包后端流程.py 临时/后端运行流程.zip
      - name: 保存后端运行流程下载包
        uses: actions/upload-artifact@v4
        with:
          name: 后端运行流程
          path: 临时/后端运行流程.zip
          if-no-files-found: error
      - name: 保存版本图验证证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 内核版本图验证
          path: 临时/版本图检查/
