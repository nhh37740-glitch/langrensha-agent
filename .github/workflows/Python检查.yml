name: Python 内核检查

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kernel:
    name: Python 内核检查
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库
        uses: actions/checkout@v4
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - name: 缓存中文语义模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/langrensha/models
          key: langrensha-bge-small-zh-v1.5-46fbe35fd437
          restore-keys: |
            langrensha-bge-small-zh-v1.5-
      - name: 安装内核与开发依赖
        run: python -m pip install -c requirements-dev.lock -e '.[dev,ai,web,rag]'
      - name: 静态检查
        run: python -m ruff check src tests .github/scripts 部署
      - name: 模块架构契约
        run: lint-imports --no-cache --cache-dir 临时/架构检查/缓存
      - name: 自动测试
        run: python -m pytest
      - name: 构建分发包
        run: python -m build
      - name: 验证 wheel 可独立安装运行
        run: |
          python -m venv 临时/构建验证/venv
          临时/构建验证/venv/bin/python -m pip install dist/*.whl
          临时/构建验证/venv/bin/python -I -m langrensha
