name: Python 内核检查

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kernel:
    name: Python 内核检查
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库
        uses: actions/checkout@v4
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - name: 安装内核与开发依赖
        run: python -m pip install -c requirements-dev.lock -e '.[dev,ai,web]'
      - name: 静态检查
        run: python -m ruff check src tests .github/scripts
      - name: 自动测试
        run: python -m pytest
      - name: 构建分发包
        run: python -m build
      - name: 验证 wheel 可独立安装运行
        run: |
          python -m venv 临时/构建验证/venv
          临时/构建验证/venv/bin/python -m pip install dist/*.whl
          临时/构建验证/venv/bin/python -I -m langrensha
