name: DeepSeek 每小时验收与串行开发

on:
  schedule:
    # 避开整点拥塞；北京时间每小时第 17 分钟，GitHub 可能延迟。
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      work:
        description: 允许处理唯一已标记任务；关闭时只验收
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: deepseek-serial
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 判断无人值守凭据
        id: credentials
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HARNESS_GH_TOKEN: ${{ secrets.HARNESS_GH_TOKEN }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ] && [ -n "$HARNESS_GH_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::缺少 DEEPSEEK_API_KEY 或 HARNESS_GH_TOKEN；验收继续，自动开发未启用。'
            echo '自动开发受阻：请在仓库 Actions Secrets 设置 DEEPSEEK_API_KEY 与 HARNESS_GH_TOKEN。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 每小时状态验收（不执行 PR 代码）
        env:
          HARNESS_CREDENTIALS_READY: ${{ steps.credentials.outputs.ready }}
        run: python .github/scripts/DeepSeek无人值守.py
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.work)
        with:
          node-version: '24'
      - name: 准备默认工作区与官方 Harness
        if: steps.credentials.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.work)
        run: |
          sudo mkdir -p /workspace
          sudo chown "$(id -u):$(id -g)" /workspace
          cp -a "$GITHUB_WORKSPACE" /workspace/langrensha-agent
          cd /workspace/langrensha-agent
          npm ci --prefix .github/deepseek-harness
          git config user.name 'DeepSeek Harness'
          git config user.email 'deepseek-harness@users.noreply.github.com'
      - name: 串行工作并请求 GitHub Codex 审查
        if: steps.credentials.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.work)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.HARNESS_GH_TOKEN }}
          HARNESS_CREDENTIALS_READY: 'true'
        run: |
          cd /workspace/langrensha-agent
          gh auth setup-git
          python .github/scripts/DeepSeek无人值守.py --work
      - name: 保存脱敏验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek每小时验收
          path: |
            临时/DeepSeek运行/验收.json
            /workspace/langrensha-agent/临时/DeepSeek运行/验收.json
          retention-days: 14
