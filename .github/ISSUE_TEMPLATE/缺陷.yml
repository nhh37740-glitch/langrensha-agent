name: 缺陷报告
description: 报告可复现的问题
title: "[缺陷] "
labels: ["缺陷"]
body:
  - type: markdown
    attributes:
      value: |
        问题描述正文（不含标题）总计不得超过 300 个汉字；超限将自动提示并关闭 Issue。
  - type: textarea
    id: location
    attributes:
      label: 发生位置与版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与证据
    validations:
      required: true
